[package]
name = "ipscanner-io"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
license = "MIT"
description = "Official Rust client for the IPScanner API: IP lookups, bulk checks, Agentscan and provenance."
homepage = "https://ipscanner.io"
documentation = "https://docs.rs/ipscanner-io"
repository = "https://github.com/ipscanner/ipscanner-rust"
readme = "README.md"
keywords = ["ip", "vpn", "proxy", "geolocation", "api"]
categories = ["api-bindings", "web-programming::http-client"]
include = ["src/**/*", "tests/**/*", "Cargo.toml", "README.md", "LICENSE"]

[lib]
name = "ipscanner"

[dependencies]
futures-util = { version = "0.3", default-features = false, features = ["std"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["time"] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "io-util"] }
wiremock = "0.6"
